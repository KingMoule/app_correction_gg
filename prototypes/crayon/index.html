<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype crayon</title>
<style>
  :root { --bar:#222; --fg:#eee; --accent:#4da3ff; }
  * { box-sizing: border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; background:#777; font:15px -apple-system,system-ui,sans-serif; }
  #bar { position:sticky; top:0; z-index:10; background:var(--bar); color:var(--fg); padding:8px 10px;
         display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
  #bar button, #bar label.btn { background:#3a3a3a; color:var(--fg); border:2px solid transparent; border-radius:8px;
         padding:8px 12px; font:inherit; }
  #bar button.on { border-color:var(--accent); background:#2b4057; }
  #bar button:disabled { opacity:.35; }
  .grp { display:flex; gap:6px; align-items:center; }
  .sw { width:34px; height:34px; border-radius:50%; padding:0 !important; border:3px solid #555 !important; }
  .sw.on { border-color:#fff !important; }
  input[type=range] { width:110px; }
  [hidden] { display:none !important; }
  #info { font-size:12px; opacity:.8; font-variant-numeric:tabular-nums; }
  #wrap { padding:12px 0 60px; display:flex; flex-direction:column; align-items:center; }
  #page { position:relative; background:#fff; box-shadow:0 2px 12px #0008; touch-action:pan-x pan-y pinch-zoom; }
  #page canvas { position:absolute; left:0; top:0; width:100%; height:100%; touch-action:pan-x pan-y pinch-zoom; }
  #hl { opacity:.4; mix-blend-mode:multiply; }
  #help { color:#fff; font-size:13px; margin:8px 12px; max-width:760px; }
</style>
</head>
<body>
<div id="bar">
  <div class="grp">
    <button id="t-pen" class="on">✎ Crayon</button>
    <button id="t-hl">🖍 Surligneur</button>
    <button id="t-er">⌫ Gomme</button>
  </div>
  <div class="grp" id="colors"></div>
  <div class="grp">
    <button id="undo">↶</button><button id="redo">↷</button><button id="clear">Tout effacer</button>
  </div>
  <div class="grp">
    <label>Min <input id="wmin" type="range" min="0.3" max="6" step="0.1" value="0.8"> <b id="wmin-v"></b></label>
    <label>Max <input id="wmax" type="range" min="1" max="20" step="0.5" value="5"> <b id="wmax-v"></b></label>
    <label>Courbe <input id="curve" type="range" min="0.4" max="2" step="0.1" value="1"> <b id="curve-v"></b></label>
  </div>
  <div class="grp">
    <label class="btn">PDF… <input id="file" type="file" accept="application/pdf" hidden></label>
    <button id="blank">Feuille blanche</button>
    <span id="pager" class="grp" hidden><button id="prev">‹</button><span id="pg"></span><button id="next">›</button></span>
  </div>
  <div class="grp"><label><input id="finger" type="checkbox"> Le doigt dessine aussi</label></div>
  <div id="info">—</div>
</div>
<div id="help">Crayon : appuyer plus fort = trait plus gros (entre Min et Max). Doigt : défiler / pincer pour zoomer. « Le doigt dessine aussi » sert pour tester à la souris ou sans Pencil.</div>
<div id="wrap"><div id="page"><canvas id="bg"></canvas><canvas id="hl"></canvas><canvas id="ink"></canvas></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
const COLORS = ['#d32f2f', '#1565c0', '#2e7d32', '#111111', '#ef6c00'];
const HL_COLORS = ['#ff5252', '#40c4ff', '#69f0ae', '#ffee58', '#ffab40'];
const W = 816, H = 1056, SCALE = 2;
const $ = id => document.getElementById(id);
const page = $('page'), bg = $('bg'), hl = $('hl'), ink = $('ink');
for (const c of [bg, hl, ink]) { c.width = W * SCALE; c.height = H * SCALE; }
page.style.width = W + 'px'; page.style.height = H + 'px';
const bgx = bg.getContext('2d'), hlx = hl.getContext('2d'), inkx = ink.getContext('2d');
for (const x of [hlx, inkx]) { x.scale(SCALE, SCALE); x.lineCap = 'round'; x.lineJoin = 'round'; }

// état
const st = { tool: 'pen', color: 0, wmin: 0.8, wmax: 5, curve: 1, cur: 0, pages: [] };
let pdf = null;
const curPage = () => st.pages[st.cur] || (st.pages[st.cur] = { strokes: [], undo: [], redo: [] });

// ----- barre d'outils -----
const colorsEl = $('colors');
COLORS.forEach((c, i) => {
  const b = document.createElement('button'); b.className = 'sw' + (i === 0 ? ' on' : ''); b.style.background = c;
  b.onclick = () => { st.color = i; [...colorsEl.children].forEach((x, j) => x.classList.toggle('on', j === i)); syncSwatches(); };
  colorsEl.appendChild(b);
});
function syncSwatches() {
  [...colorsEl.children].forEach((b, i) => b.style.background = st.tool === 'hl' ? HL_COLORS[i] : COLORS[i]);
}
function setTool(t) {
  st.tool = t;
  for (const k of ['pen', 'hl', 'er']) $('t-' + k).classList.toggle('on', k === t);
  syncSwatches();
}
$('t-pen').onclick = () => setTool('pen'); $('t-hl').onclick = () => setTool('hl'); $('t-er').onclick = () => setTool('er');
for (const k of ['wmin', 'wmax', 'curve']) {
  const el = $(k), out = $(k + '-v');
  const f = () => { st[k] = +el.value; out.textContent = (+el.value).toFixed(1); if (st.wmin > st.wmax) { st.wmax = st.wmin; $('wmax').value = st.wmax; $('wmax-v').textContent = st.wmax.toFixed(1); } };
  el.oninput = f; f();
}

// ----- rendu des traits -----
function widthFor(s, p) { // p: 0..1
  if (s.tool === 'hl') return s.wmax * 3;
  return s.wmin + (s.wmax - s.wmin) * Math.pow(Math.min(1, Math.max(0, p)), s.curve);
}
function drawSeg(ctx, s, a, b, c) { // courbe quadratique a -> c, contrôle b, largeur selon pression
  const w = widthFor(s, (a.p + c.p) / 2);
  ctx.lineWidth = w; ctx.strokeStyle = s.tool === 'hl' ? HL_COLORS[s.color] : COLORS[s.color];
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(b.x, b.y, c.x, c.y); ctx.stroke();
}
function ctxFor(s) { return s.tool === 'hl' ? hlx : inkx; }
function drawStroke(s) {
  const ctx = ctxFor(s), pts = s.pts;
  if (pts.length === 1) {
    ctx.fillStyle = s.tool === 'hl' ? HL_COLORS[s.color] : COLORS[s.color];
    ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, widthFor(s, pts[0].p) / 2, 0, 7); ctx.fill(); return;
  }
  let prev = pts[0];
  for (let i = 1; i < pts.length; i++) {
    const mid = { x: (pts[i - 1].x + pts[i].x) / 2, y: (pts[i - 1].y + pts[i].y) / 2, p: (pts[i - 1].p + pts[i].p) / 2 };
    drawSeg(ctx, s, prev, pts[i - 1], mid); prev = mid;
  }
  drawSeg(ctx, s, prev, pts[pts.length - 1], pts[pts.length - 1]);
}
function redraw() {
  hlx.clearRect(0, 0, W, H); inkx.clearRect(0, 0, W, H);
  for (const s of curPage().strokes) drawStroke(s);
  updateButtons();
}

// ----- saisie -----
const strokeDown = new Map(); // pointerId -> {stroke, drawnTo}
let fingerDraws = false; $('finger').onchange = e => fingerDraws = e.target.checked;
const accepts = e => e.pointerType === 'pen' || e.pointerType === 'mouse' || (e.pointerType === 'touch' && fingerDraws);
function pos(e) { const r = ink.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function pressure(e) { return e.pointerType === 'pen' ? (e.pressure || 0.01) : 0.5; }

// Le Pencil ne doit ni défiler ni zoomer ; le doigt oui (touchType 'stylus' d'iPadOS).
page.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) if (t.touchType === 'stylus' || fingerDraws) { e.preventDefault(); return; }
}, { passive: false });
page.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) if (t.touchType === 'stylus' || fingerDraws) { e.preventDefault(); return; }
}, { passive: false });

let lastP = 0.5;
ink.addEventListener('pointerdown', e => {
  if (!accepts(e)) return;
  e.preventDefault(); ink.setPointerCapture(e.pointerId);
  const p = pos(e); p.p = lastP = pressure(e);
  if (st.tool === 'er') { strokeDown.set(e.pointerId, { erase: true, removed: [] }); eraseAt(p, strokeDown.get(e.pointerId)); return; }
  const s = { tool: st.tool, color: st.color, wmin: st.wmin, wmax: st.wmax, curve: st.curve, pts: [p] };
  strokeDown.set(e.pointerId, { s, drawn: 0 });
  curPage().strokes.push(s); drawLive(strokeDown.get(e.pointerId));
}, { passive: false });

ink.addEventListener('pointermove', e => {
  const d = strokeDown.get(e.pointerId);
  const t0 = performance.now();
  if (e.pointerType === 'pen') info(e);
  if (!d) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = pos(ev);
    if (d.erase) { eraseAt(p, d); continue; }
    const last = d.s.pts[d.s.pts.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 0.4) continue;
    // lissage léger de la pression pour éviter les sauts
    p.p = lastP = lastP * 0.5 + pressure(ev) * 0.5;
    d.s.pts.push(p);
  }
  if (!d.erase) drawLive(d);
  fps(performance.now() - t0);
}, { passive: false });

function drawLive(d) { // ne dessine que les nouveaux segments
  const s = d.s, pts = s.pts, ctx = ctxFor(s);
  if (pts.length === 1) { drawStroke(s); return; }
  const from = Math.max(1, d.drawn || 1);
  let prev = from === 1 ? pts[0] : mid(pts[from - 2], pts[from - 1]);
  for (let i = from; i < pts.length; i++) {
    const m = mid(pts[i - 1], pts[i]);
    drawSeg(ctx, s, prev, pts[i - 1], m); prev = m;
  }
  d.drawn = pts.length;
}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, p: (a.p + b.p) / 2 });

function end(e) {
  const d = strokeDown.get(e.pointerId); if (!d) return;
  strokeDown.delete(e.pointerId);
  const pg = curPage();
  if (d.erase) { if (d.removed.length) { pg.undo.push({ type: 'erase', strokes: d.removed }); pg.redo = []; } }
  else {
    drawStroke(d.s); // trace finale propre jusqu'au dernier point
    pg.undo.push({ type: 'add', stroke: d.s }); pg.redo = [];
  }
  updateButtons();
}
ink.addEventListener('pointerup', end); ink.addEventListener('pointercancel', end);
ink.addEventListener('contextmenu', e => e.preventDefault());

function eraseAt(p, d) {
  const pg = curPage(), r = 10; let hit = false;
  pg.strokes = pg.strokes.filter(s => {
    if (s.pts.some(q => Math.hypot(q.x - p.x, q.y - p.y) < r + widthFor(s, q.p) / 2)) { d.removed.push(s); hit = true; return false; }
    return true;
  });
  if (hit) redraw();
}

// ----- annuler / rétablir -----
function updateButtons() { const pg = curPage(); $('undo').disabled = !pg.undo.length; $('redo').disabled = !pg.redo.length; }
$('undo').onclick = () => {
  const pg = curPage(), a = pg.undo.pop(); if (!a) return;
  if (a.type === 'add') pg.strokes = pg.strokes.filter(s => s !== a.stroke); else pg.strokes.push(...a.strokes);
  pg.redo.push(a); redraw();
};
$('redo').onclick = () => {
  const pg = curPage(), a = pg.redo.pop(); if (!a) return;
  if (a.type === 'add') pg.strokes.push(a.stroke); else pg.strokes = pg.strokes.filter(s => !a.strokes.includes(s));
  pg.undo.push(a); redraw();
};
$('clear').onclick = () => {
  const pg = curPage(); if (!pg.strokes.length) return;
  pg.undo.push({ type: 'erase', strokes: pg.strokes }); pg.redo = []; pg.strokes = []; redraw();
};

// ----- fond : feuille blanche ou PDF -----
function blank() { bgx.fillStyle = '#fff'; bgx.fillRect(0, 0, bg.width, bg.height); }
blank();
$('blank').onclick = () => { pdf = null; st.pages = []; st.cur = 0; $('pager').hidden = true; blank(); redraw(); };
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (!window.pdfjsLib) { alert('pdf.js n’a pas pu se charger (pas d’internet ?).'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
  st.pages = []; st.cur = 0; await showPdfPage();
};
async function showPdfPage() {
  const pg = await pdf.getPage(st.cur + 1), vp0 = pg.getViewport({ scale: 1 });
  const k = Math.min(W / vp0.width, H / vp0.height), vp = pg.getViewport({ scale: k * SCALE });
  blank();
  const tmp = document.createElement('canvas'); tmp.width = vp.width; tmp.height = vp.height;
  await pg.render({ canvasContext: tmp.getContext('2d'), viewport: vp }).promise;
  bgx.drawImage(tmp, 0, 0);
  $('pager').hidden = false; $('pg').textContent = (st.cur + 1) + ' / ' + pdf.numPages;
  $('prev').disabled = st.cur === 0; $('next').disabled = st.cur === pdf.numPages - 1;
  redraw();
}
$('prev').onclick = () => { st.cur--; showPdfPage(); };
$('next').onclick = () => { st.cur++; showPdfPage(); };

// ----- infos de test -----
let frames = [], infoTxt = '';
function fps(ms) { frames.push(ms); if (frames.length > 60) frames.shift(); }
function info(e) {
  const avg = frames.length ? (frames.reduce((a, b) => a + b, 0) / frames.length).toFixed(1) : '–';
  infoTxt = `pression ${e.pressure.toFixed(2)} · inclinaison ${Math.round(e.tiltX || 0)}°,${Math.round(e.tiltY || 0)}° · traitement ${avg} ms/évt`;
  $('info').textContent = infoTxt;
}
redraw();
</script>
</body>
</html>
