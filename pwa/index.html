<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Correction">
  <meta name="theme-color" content="#b3261e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icone.svg">
  <link rel="stylesheet" href="style.css">
  <title>Correction de labs</title>
</head>
<body>
  <main>
    <h1>Correction de labs</h1>
    <p id="etat">Connexion au moteur…</p>

    <section id="bibliotheque">
      <h2>Bibliothèque</h2>
      <div id="arbre"><p>Aucune classe importée.</p></div>
    </section>

    <section>
      <h2>Liste de classe</h2>
      <p class="aide">Fichier Excel ou CSV nommé <code>ListeEtudiants_cours…_gr…</code>.</p>
      <input type="file" id="fichier-classe" accept=".xlsx,.xlsm,.csv">
    </section>

    <section>
      <h2>Importer des rapports (PDF)</h2>
      <select id="choix-classe"></select>
      <input type="text" id="lab" placeholder="Lab (ex. Lab 3)">
      <input type="file" id="fichiers-pdf" accept="application/pdf" multiple>
      <button id="importer">Importer</button>
      <p id="resultat-import" aria-live="polite"></p>
    </section>

    <section id="section-ia" hidden>
      <h2>Indices d'IA</h2>
      <p id="ia-titre"></p>
      <p class="aide" id="ia-avertissement">Indice à revérifier, jamais un verdict.</p>
      <button id="ia-analyser">Analyser le style avec Claude</button>
      <button id="ia-pangram">Copier le texte et ouvrir Pangram</button>
      <p id="ia-etat" aria-live="polite"></p>
      <div id="ia-resultat"></div>
    </section>

    <section id="section-attente" hidden>
      <h2>À trancher</h2>
      <div id="attente"></div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="indices-ia.js"></script>
</body>
</html>
