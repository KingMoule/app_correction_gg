<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#20242b">
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="lecteur.css">
  <title>Lecteur — Correction de labs</title>
</head>
<body>
  <div id="barre">
  <div class="ligne">
    <div class="grp">
      <a id="retour" class="bouton" href="/#biblio"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Bibliothèque</a>
      <span id="titre"></span>
    </div>
    <div class="grp" id="suivi">
      <a id="tableau" class="bouton" href="/#biblio" title="Retour au tableau de suivi du lab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Tableau</a>
      <button id="prec" title="Rapport précédent, dans l'ordre du tableau"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Précédent</button>
      <span id="position"></span>
      <button id="suiv" class="principal" title="Enregistre, puis ouvre le prochain rapport non terminé du lab">Rapport suivant<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <span id="statut" class="etiquette"></span>
      <button id="termine">✔ Terminé</button>
      <button id="termine-suivant" class="principal">✔ Terminé et suivant</button>
    </div>
    <div class="grp">
      <button id="ajuster">Ajuster</button>
      <a id="exporter" class="bouton" title="Télécharger le PDF annoté pour LÉA">Exporter le PDF</a>
      <button id="francais-bouton">Français</button>
      <button id="reglages-bouton">Réglages</button>
    </div>
    <span id="page-info"></span>
    <span id="sauvegarde" aria-live="polite"></span>
  </div>
  <div id="outils" class="ligne">
    <div class="grp">
      <button id="o-crayon" class="outil on" title="Crayon" aria-label="Crayon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16.5 4a1.8 1.8 0 012.5 0l1 1a1.8 1.8 0 010 2.5L8.5 19z"/><path d="M14.5 6l3.5 3.5"/><path d="M4 20l4.5-1"/></svg><i></i></button>
      <button id="o-surligneur" class="outil" title="Surligneur" aria-label="Surligneur"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3l5.5 5.5-8 8-5.5-5.5z"/><path d="M7.5 11l5.5 5.5-3 3H6v-3.2L4 14.5z"/><path d="M3 22h18" stroke-width="2.6" opacity=".55"/></svg><i></i></button>
      <button id="o-gomme" class="outil" title="Gomme" aria-label="Gomme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 14L14 4.5a2 2 0 012.8 0l3.2 3.2a2 2 0 010 2.8L11 19.5H7z"/><path d="M9.5 9l6 6"/><path d="M12 20h8.5"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp" id="options-trait">
      <div class="menu">
        <button id="ep-bouton" title="Épaisseur du trait" aria-label="Épaisseur du trait" aria-haspopup="true" aria-expanded="false"><span class="trait-ap"></span><small>▾</small></button>
        <div id="epaisseurs" hidden></div>
      </div>
      <div class="grp" id="couleurs"></div>
    </div>
    <div class="grp" id="options-gomme" hidden>
      <button id="g-trait">Trait entier</button>
      <button id="g-partielle">Partielle</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="annuler" title="Annuler" aria-label="Annuler">↶</button>
      <button id="retablir" title="Rétablir" aria-label="Rétablir">↷</button>
    </div>
    <div class="sep"></div>
    <div class="grp"><button id="bascule" title="Bascule crayon / gomme" aria-label="Bascule crayon / gomme">⇄</button></div>
    <div id="reglages" hidden>
      <label>Courbe de pression <input id="r-courbe" type="range" min="0.4" max="2" step="0.1"> <b></b></label>
      <label>Gomme <input id="r-gomme" type="range" min="2" max="25" step="1"> <b></b></label>
      <label><input id="r-doigt" type="checkbox"> Le doigt dessine aussi</label>
    </div>
  </div>
</div>
  <div id="corps">
    <div id="fenetre"><div id="taille"><div id="pile"></div></div></div>
      <aside id="francais" hidden>
        <div id="detail" hidden></div>
        <p id="fr-etat"></p>
        <p id="fr-resume"></p>
        <div class="fr-actions">
          <button id="fr-analyser">Analyser le français</button>
          <button id="fr-tout-accepter">Accepter les fautes à trancher</button>
        </div>
        <fieldset>
          <legend>Barème du cours</legend>
          <label>Points par faute <input id="fr-points" type="number" min="0" step="0.25"></label>
          <label>Plafond <input id="fr-plafond" type="number" min="0" step="0.5" placeholder="aucun"></label>
        </fieldset>
        <div id="fr-liste"></div>
      </aside>
  </div>
  <p id="message" hidden></p>
  <script src="vendor/pdf.min.js"></script>
  <script src="lecteur.js"></script>
  <script src="francais.js"></script>
  <script src="navigation-lecteur.js"></script>
</body>
</html>
