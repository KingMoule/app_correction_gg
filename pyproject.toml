[project]
name = "correction-labs"
version = "0.1.0"
description = "Moteur local et PWA pour corriger les rapports de lab"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pypdf>=4",
    "reportlab>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["moteur"]

[tool.setuptools.package-data]
moteur = ["polices/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
