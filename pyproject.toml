[project]
name = "correction-labs"
version = "0.1.0"
description = "Moteur local et PWA pour corriger les rapports de lab"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["moteur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
